<!doctype html><html><head><meta charset="utf-8"><title>stage test</title></head><body>
<script type="module">
import * as THREE from 'three';
import { createStage } from './stage.js';
import { part, merge, rbox, cyl, cone, sphere, ico, jitter, meshOf } from '../src/world/geo.js';
import { materials } from '../src/gfx/materials.js';
import { P } from '../src/gfx/palette.js';
const stage = await createStage();
// quick test house + tree + ball
const house = meshOf([
  part(rbox(6, 4, 5, 0.25), P.wallPeach, { y: 2 }),
  part(cone(4.6, 2.6, 4), P.roofTerracotta, { y: 5.3, ry: Math.PI / 4, sx: 1, sz: 0.85 }),
  part(rbox(1.2, 2, 0.3, 0.1), P.tomato, { y: 1, z: 2.55 }),
  part(rbox(1.3, 1.1, 0.3, 0.1), P.glass, { x: -1.8, y: 2.4, z: 2.55 }),
  part(rbox(1.3, 1.1, 0.3, 0.1), P.glass, { x: 1.8, y: 2.4, z: 2.55 }),
  part(rbox(0.9, 2, 0.9, 0.15), P.brick, { x: 1.8, y: 5.4 }),
], materials.toy);
const tree = new THREE.Group();
tree.add(meshOf([part(cyl(0.25, 0.35, 3, 8), P.woodDark, { y: 1.5 })], materials.toy));
tree.add(meshOf([part(jitter(ico(2.2, 1), 0.25), [P.grassDark, P.grassLight], { y: 4.2 })], materials.foliage));
const ball = meshOf([part(sphere(1, 32, 16), P.tomato, { y: 1 })], materials.glossy);
stage.grid([{ object: house, label: 'house' }, { object: tree, label: 'tree' }, { object: ball, label: 'ball' }], 10, 3);
stage.frame();
</script></body></html>
