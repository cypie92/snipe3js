<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Props & Nature kit</title>
<style>
  #panel { position: fixed; top: 8px; left: 8px; max-height: 96vh; overflow: auto; font: 11px/1.35 monospace;
    color: #fff8ee; background: rgba(43, 43, 58, .82); padding: 6px 8px; border-radius: 8px; display: none; }
  #panel b { color: #ffc93c; }
  #panel .over { color: #ff7a6e; }
</style>
</head>
<body>
<div id="panel"></div>
<script type="module">
// Props & Nature kit preview. Extra URL params (besides stage.js ones):
//   set=nature,street,yard,market,festive,vehicles,gags   only=<name>,<name>   (substring match)
//   stats=1 (triangle / draw-call table)   colliders=1 (show hit colliders)
//   demo=1 (periodically trigger animations: unfurl, pop, launch, ring...)   gap=<m>   row=<max row width m>
import * as THREE from 'three';
import { createStage } from './stage.js';
import { catalog } from '../src/world/kit/props/catalog.js';
import { stats } from '../src/world/kit/props/lib.js';

const params = new URLSearchParams(location.search);
const stage = await createStage();
const sets = params.get('set')?.split(',');
const only = params.get('only')?.split(',');
const gap = Number(params.get('gap') || 1.6);

let list = catalog();
if (sets) list = list.filter(([, cat]) => sets.includes(cat));
if (only) list = list.filter(([name]) => only.some((o) => name.includes(o)));

// Build everything, then lay out rows per category (wrapping), items left->right by footprint.
const built = [];
for (const [name, cat, fn] of list) {
  try {
    const obj = fn();
    obj.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(obj);
    built.push({ name, cat, obj, box, s: stats(obj) });
  } catch (e) {
    console.error(`build failed: ${name}`, e);
  }
}
// Rows wrap at ~square-ish width; each category starts a new row.
const area = built.reduce((s, b) => s + (b.box.max.x - b.box.min.x + gap) * (b.box.max.z - b.box.min.z + gap), 0);
const maxRow = Number(params.get('row') || Math.max(10, Math.sqrt(area) * 1.5));
const rows = [];
let cur = null;
for (const b of built) {
  const w = Math.max(1.2, b.box.max.x - b.box.min.x) + gap;
  if (!cur || cur.cat !== b.cat || cur.w + w > maxRow) rows.push(cur = { cat: b.cat, items: [], w: 0 });
  cur.items.push(b);
  cur.w += w;
}
let z = 0;
let maxW = 0;
const place = [];
for (const row of rows) {
  const depth = Math.max(...row.items.map((b) => b.box.max.z - b.box.min.z));
  let x = 0;
  for (const b of row.items) {
    const w = Math.max(1.2, b.box.max.x - b.box.min.x);
    place.push({ b, x: x - b.box.min.x, z: z + depth / 2 - (b.box.min.z + b.box.max.z) / 2 });
    x += w + gap;
  }
  row.width = x - gap;
  maxW = Math.max(maxW, row.width);
  z += depth + gap * 2;
}
const totalD = z;
place.forEach(({ b, x, z: zz }, i) => {
  const row = rows.find((r) => r.items.includes(b));
  b.index = i;
  stage.add(b.obj, x - row.width / 2, zz - totalD / 2, 0, `${i} ${b.name}`);
});
stage.extent = Math.max(maxW, totalD) * 0.86;
stage.frame();

if (params.get('colliders') === '1') {
  stage.scene.traverse((o) => { if (o.userData.collider) o.visible = true; });
}

const table = place.map(({ b }) => ({ i: b.index, name: b.name, cat: b.cat, tris: b.s.tris, calls: b.s.calls }));
window.__catalog = table;
console.log('[props] ' + table.map((r) => `${r.i}:${r.name}(${r.tris}t/${r.calls}dc)`).join('  '));
if (params.get('stats') === '1') {
  const el = document.getElementById('panel');
  el.style.display = 'block';
  el.innerHTML = table.map((r) => {
    const budget = r.cat === 'vehicles' ? 4000 : r.name.startsWith('tree') ? 1200 : 1500;
    const over = (r.tris > budget && !/forest|scatter/.test(r.name)) || (r.calls > 3 && !/forest/.test(r.name));
    return `<span class="${over ? 'over' : ''}"><b>${r.i}</b> ${r.name} ${r.tris}t ${r.calls}dc</span>`;
  }).join('<br>');
}

// Demo mode: poke every interactive asset now and then.
if (params.get('demo') === '1') {
  let t = 0;
  let step = 0;
  stage.onUpdate((dt) => {
    t += dt;
    if (t < 2.5) return;
    t = 0;
    step++;
    for (const { b } of place) {
      const u = b.obj.userData;
      if (u.setFurled) u.setFurled(step % 2 === 0);
      if (u.popBalloon && u.parts.balloons) {
        const live = u.parts.balloons.filter((x) => !x.userData.popped);
        if (live.length > 1) u.popBalloon(live[0]); else u.reset?.();
      }
      if (u.launch) { if (step % 3 === 1) u.launch(); if (step % 3 === 0) u.reset?.(); }
      if (u.ring) u.ring(step % 2 === 1);
      if (u.setRaised) u.setRaised(step % 2 === 0);
      if (u.spill && step === 1) u.spill();
      if (u.flash && step % 2) u.flash();
      if (u.bonk && step % 2) u.bonk();
      if (u.setOpen && /bin|wheelie/i.test(b.name)) u.setOpen(step % 2 === 1);
      if (u.free && step === 1) u.free();
      if (u.snap && step % 3 === 2) u.snap();
      if (u.splat && step % 2) u.splat();
      if (u.avalanche && step === 3) u.avalanche();
    }
  });
}
</script>
</body>
</html>
