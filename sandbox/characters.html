<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Characters — Jack of All Blasts</title>
</head>
<body>
<script type="module">
// Character line-up studio (real renderer/post/lighting via stage.js).
// URL params (plus stage.js ones: cam, dist, zoom, yaw, preset, quality, labels, focus):
//   set=all|presets|random|animals|crowd   action=<name> (everyone)   t=<sec> freeze clock at t
//   react=<sec> trigger react() at that time (noorigin=1: no hit.origin -> camera fallback)   celebrate=<sec>   look=1 (everyone looks at camera)
//   n=<count> random villagers   seed=<n>   only=<index> show one item   theme=beach|harbour (random villagers)
//   aopt=k:v,k2:v2 action options (e.g. action=lie&aopt=pose:deckchair)   set=harbourline|harbour (Barnacle Bay)
//   set=tells (tell stickers)  set=species&species=Seal[&actions=a,b]  set=acts&actions=row,lie~pose=front[&who=<preset>]
import * as THREE from 'three';
import { createStage } from './stage.js';
import { Person, Crowd, Walker, ANIMALS, PigeonFlock, GullFlock, Seal, Crab, SealCatch, Pelican, setCharacterLook, setCharacterScale } from '../src/world/characters/index.js';
import { Rng } from '../src/core/rng.js';
import { part, merge, rbox, meshOf, cyl, cone, sphere, box, ico, jitter } from '../src/world/geo.js';
import { materials } from '../src/gfx/materials.js';
import { P } from '../src/gfx/palette.js';

window.__chars = { THREE, Person, Crowd, Walker, ANIMALS, PigeonFlock, Rng };
const params = new URLSearchParams(location.search);
const num = (k, d) => (params.has(k) ? Number(params.get(k)) : d);
if (params.has('rim')) setCharacterLook({ rim: num('rim', 0.45) });   // rim=0 disables the distance rim
if (params.has('cscale')) setCharacterScale(num('cscale', 1));       // global character scale
const set = params.get('set') || 'all';
const action = params.get('action');
const theme = params.get('theme') || undefined;
const aopt = Object.fromEntries((params.get('aopt') || '').split(',').filter(Boolean).map((kv) => {
  const [k, v] = kv.split(':');
  return [k, v === 'true' ? true : v === 'false' ? false : Number.isNaN(Number(v)) ? v : Number(v)];
}));
const T = params.has('t') ? num('t', 0) : null;
const stage = await createStage({ cam: 'front', yaw: 0 });
const rng = new Rng(num('seed', 7));
const actors = [];   // everything with update(dt, t)
const items = [];    // { object, label, x, z }

function bench(x, z, h = 0.45) {
  const m = meshOf([
    part(rbox(1.1, 0.08, 0.42, 0.03), P.wood, { y: h - 0.04 }),
    part(rbox(0.08, h - 0.08, 0.36, 0.02), P.woodDark, { x: -0.45, y: (h - 0.08) / 2 }),
    part(rbox(0.08, h - 0.08, 0.36, 0.02), P.woodDark, { x: 0.45, y: (h - 0.08) / 2 }),
  ], materials.toy);
  m.position.set(x, 0, z - 0.02);
  stage.scene.add(m);
}

// ---- set dressing for harbour/beach actions (mock props; the real ones come from the props kit)
const WATER_Y = 0.03;
const add = (m, x, y, z, ry = 0) => { m.position.set(x, y, z); m.rotation.y = ry; stage.scene.add(m); m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; };
const waterMat = materials.solid(P.water, { roughness: 0.15 });
function pool(x, z, rx = 1.3, rz = rx) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(1, 40).rotateX(-Math.PI / 2), waterMat);
  m.scale.set(rx, 1, rz); m.receiveShadow = true;
  return add(m, x, WATER_Y, z);
}
function towel(x, z, col = P.bubblegum) {
  return add(meshOf([part(rbox(0.85, 0.03, 1.85, 0.012), (px, py, pz, c) => c.set(Math.floor((pz + 1) * 5) % 2 ? col : '#fff8ee'), {})], materials.toy), x, 0.015, z);
}
function deckchair(x, z) {
  const stripe = (px, py, pz, c) => c.set(Math.floor((px + 1) * 9) % 2 ? P.tomato : '#fff8ee');
  return add(meshOf([
    part(rbox(0.62, 0.03, 0.62, 0.01), stripe, { y: 0.26, z: 0.05, rx: -0.12 }),
    part(rbox(0.62, 0.03, 0.72, 0.01), stripe, { y: 0.52, z: -0.38, rx: -1.05 }),
    ...[-0.34, 0.34].flatMap((sx) => [
      part(rbox(0.04, 0.04, 1.0, 0.01), P.woodLight, { x: sx, y: 0.36, z: -0.25, rx: -0.95 }),
      part(rbox(0.04, 0.04, 0.9, 0.01), P.woodLight, { x: sx, y: 0.2, z: 0.12, rx: 0.45 }),
      part(rbox(0.04, 0.04, 0.46, 0.01), P.woodLight, { x: sx, y: 0.34, z: 0.22 }),
    ]),
  ], materials.toy), x, 0, z);
}
function rowboat(x, z, oarlockY) {
  const hull = meshOf([
    part(rbox(1.3, 0.42, 2.3, 0.18), [P.woodDark, P.wood], { y: 0.21 }),
    part(rbox(1.36, 0.08, 2.36, 0.04), P.tomato, { y: 0.4 }),
    part(rbox(1.18, 0.05, 0.3, 0.02), P.woodLight, { y: 0.44, z: -0.08 }),
    ...[-1, 1].map((sd) => part(cyl(0.025, 0.025, oarlockY - 0.4, 6), P.metalDark, { x: sd * 0.62, y: (oarlockY + 0.4) / 2 + 0.12, z: 0.25 })),
  ], materials.toy);
  pool(x, z, 2.6, 2.0);
  return add(hull, x, 0, z);
}
function dinghy(x, z) {
  pool(x, z, 1.8, 1.5);
  return add(meshOf([part(rbox(1.0, 0.36, 1.7, 0.16), [P.cobalt, '#fff8ee'], { y: 0.18 }), part(rbox(0.9, 0.05, 0.25, 0.02), P.woodLight, { y: 0.4, z: -0.05 })], materials.toy), x, 0, z);
}
function ropePost(x, z, h = 0.95) {
  add(meshOf([part(cyl(0.16, 0.2, 0.9, 10), P.metalDark, { y: 0.45 }), part(cyl(0.24, 0.24, 0.08, 10), P.metalDark, { y: 0.92 })], materials.toy), x, 0, z + 2.2);
  const a = new THREE.Vector3(x, 0.7, z + 2.1), b = new THREE.Vector3(x, h, z + 0.55);
  const d = b.clone().sub(a);
  const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, d.length(), 6), materials.solid('#e3c28a'));
  rope.position.copy(a).add(b).multiplyScalar(0.5);
  rope.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  stage.scene.add(rope);
}
function sandcastle(x, z) {
  add(new THREE.Mesh(new THREE.CircleGeometry(1.1, 24).rotateX(-Math.PI / 2), materials.solid(P.sand, { roughness: 0.95 })), x, 0.012, z);
  return add(meshOf([
    part(cyl(0.2, 0.24, 0.22, 10), P.sand, { y: 0.11 }), part(cone(0.16, 0.16, 10), P.sand, { y: 0.3 }),
    part(cyl(0.1, 0.12, 0.14, 8), P.pathDark, { x: 0.3, y: 0.07, z: 0.1 }), part(cone(0.03, 0.12, 4), P.tomato, { y: 0.42 }),
    part(cyl(0.1, 0.08, 0.16, 10), P.cobalt, { x: -0.35, y: 0.08, z: 0.15 }),
  ], materials.toy), x + 0.05, 0, z + 0.55);
}
function lifeguardChair(x, z, h) {
  return add(meshOf([
    ...[-1, 1].flatMap((sx) => [-1, 1].map((sz) => part(rbox(0.07, h, 0.07, 0.02), '#fff8ee', { x: sx * 0.3, y: h / 2, z: sz * 0.28 - 0.1, rx: sz * 0.08, rz: sx * 0.06 }))),
    part(rbox(0.7, 0.06, 0.6, 0.02), P.tomato, { y: h, z: -0.05 }), part(rbox(0.7, 0.5, 0.05, 0.02), P.tomato, { y: h + 0.3, z: -0.33 }),
  ], materials.toy), x, 0, z);
}
/** Place props for the actor's current action; may move the actor (e.g. onto the water). */
function dress(a, x, z) {
  if (a.kind !== 'person') return;
  const o = a.blender.cur.opts;
  switch (a.action) {
    case 'tread': case 'swim': pool(x, z, a.action === 'swim' ? 1.1 : 0.9, a.action === 'swim' ? 1.5 : 0.9); a.root.position.y = WATER_Y; break;
    case 'lie': if (o.pose === 'deckchair') deckchair(x, z); else towel(x, z, [P.bubblegum, P.teal, P.sunflower][Math.abs(Math.round(x)) % 3]); break;
    case 'row': rowboat(x, z, 0.62); a.root.position.y = 0.12; break;
    case 'paddle': dinghy(x, z); a.root.position.y = 0.12; break;
    case 'pull': ropePost(x, z, o.height ?? 0.95); break;
    case 'dig': sandcastle(x, z); break;
    case 'lookout': if (o.height) lifeguardChair(x, z, o.height); break;
    default:
  }
}

// range=a-b keeps only items a..b of each set; cols=<n> wraps rows into a grid (rows go back in -z)
const [ra, rb] = (params.get('range') || '0-999').split('-').map(Number);
function placeRow(list, z, spacing, label = true, cols = num('cols', 0), rowGap = 2.3) {
  list = list.slice(ra, rb + 1);
  const per = cols || list.length;
  list.forEach((it, idx) => {
    const n = Math.min(per, list.length - Math.floor(idx / per) * per);
    const i = idx % per;
    const x = (i - (n - 1) / 2) * spacing + (Math.floor(idx / per) % 2) * spacing * 0.5;
    const zz = z - Math.floor(idx / per) * rowGap;
    const obj = it.root;
    stage.add(obj, x, zz, 0, label ? it.label : undefined);
    items.push({ object: obj, x, z: zz });
    actors.push(it.actor);
    dress(it.actor, x, zz);
    if (it.actor.kind === 'person' && (it.actor.action === 'sit' || it.actor.action === 'sleep') && !it.actor.blender?.cur.opts.stand) bench(x, zz);
    if (it.actor.action === 'fish') {
      const w = new THREE.Mesh(new THREE.CircleGeometry(0.9, 24).rotateX(-Math.PI / 2), materials.solid(P.water, { roughness: 0.2 }));
      w.position.set(x + 0.35, 0.01, zz + 2.4); stage.scene.add(w);
    }
  });
}

const apply = (p) => { if (action) p.setAction(action, aopt, 0); return p; };
const all = set === 'all';

// "group photo" for set=all: animals in front, presets in two rows, random villagers behind
if ((all || set === 'animals') && ANIMALS) {
  const order = all ? ['Cow', 'Sheep', 'Dog', 'Cat', 'Pigeon', 'Chicken', 'Duck', 'Gull', 'Pelican'] : Object.keys(ANIMALS);
  const row = order.map((name, i) => [name, ANIMALS[name]]).map(([name, Cls], i) => {
    const a = new Cls({ seed: 3 + i });
    if (action && a.hasAction?.(action)) a.setAction(action, {}, 0);
    if (all && name === 'Duck') a.setAction('idle', {}, 0);
    return { root: a.root, actor: a, label: name };
  });
  placeRow(row, all ? 2.5 : 0, all ? 1.3 : 1.7);
}
if (all || set === 'presets') {
  const row = Person.presets.map((name, i) => {
    const p = apply(Person.preset(name, { seed: 101 + i * 37 }));
    if (all && !action && p.action === 'fish') p.setAction('idle', {}, 0);
    return { root: p.root, actor: p, label: name };
  });
  if (all) placeRow(row, 0.4, 1.45, true, 8, 1.7);
  else placeRow(row, 0, 1.45);
}
if (all || set === 'random') {
  const n = num('n', set === 'random' ? 24 : 16);
  const per = Math.ceil(n / 2);
  for (let r = 0; r < 2; r++) {
    const row = [];
    for (let i = 0; i < per && r * per + i < n; i++) {
      const p = apply(Person.random(rng, { theme }));
      row.push({ root: p.root, actor: p, label: `#${r * per + i}` });
    }
    placeRow(row, set === 'random' ? -r * 2.6 : -3.1 - r * 1.7, set === 'random' ? 1.35 : 1.3, !all);
  }
}
// set=tells: every action that pops a tell sticker (+ a sleeper) for perch-distance readability checks
if (set === 'tells') {
  const acts = ['scratch', 'shrug', 'lookUp', 'point', 'panic', 'alarm', 'dance', 'sleep', 'jig', 'shakeFist'];
  const row = acts.map((a, i) => { const p = Person.random(new Rng(700 + i)); p.setAction(a, a === 'sleep' ? { stand: true } : {}, 0); return { root: p.root, actor: p, label: a }; });
  placeRow(row, 0, 1.6);
}
// set=species&species=Seal&actions=idle,bark,...: one animal per action (default: all its actions)
if (set === 'species') {
  const Cls = ANIMALS[params.get('species') || 'Seal'];
  const acts = (params.get('actions') || Cls.actions.join(',')).split(',');
  const row = acts.map((a, i) => { const an = new Cls({ seed: 11 + i, action: a }); return { root: an.root, actor: an, label: a }; });
  placeRow(row, 0, num('spacing', 1.6));
  for (const it of row) if (it.actor.species === 'crab' && it.actor.gaitActions.has(it.actor.action)) it.root.rotation.y = Math.PI / 2; // travelling along the row, face to camera
  for (const it of row) if (it.actor.constructor.WET_ACTIONS?.has(it.actor.action)) { pool(it.root.position.x, it.root.position.z, 0.7, 0.9); it.root.position.y = WATER_Y; }
}
// set=acts&actions=row,lie~pose=front,lookout~height=1.4: one villager per action (+ mock dressing); who=<preset> uses a preset
if (set === 'acts') {
  const val = (v) => (v === 'true' ? true : v === 'false' ? false : Number.isNaN(Number(v)) ? v : Number(v));
  const list = (params.get('actions') || 'row,paddle,pull,jig,shakeFist,eat~food=chips').split(',');
  const row = list.map((spec, i) => {
    const [name, ...kv] = spec.split('~');
    const opts = { ...aopt, ...Object.fromEntries(kv.map((e) => { const [k, v] = e.split('='); return [k, val(v)]; })) };
    const p = params.get('who') ? Person.preset(params.get('who'), { seed: 500 + i }) : Person.random(new Rng(num('seed', 7) * 100 + i), { theme: theme || 'harbour' });
    p.setAction(name, opts, 0);
    return { root: p.root, actor: p, label: kv.length ? `${name} ${kv.join(' ')}` : name };
  });
  placeRow(row, 0, num('spacing', 1.9));
}
const HARBOUR_PRESETS = ['docker', 'captain', 'lifeguard', 'fishmonger', 'swimmer', 'sunbather', 'sailorKid'];
if (set === 'harbourline') {
  const row = HARBOUR_PRESETS.map((name, i) => ({ p: apply(Person.preset(name, { seed: 301 + i * 41 })), name }))
    .map(({ p, name }) => ({ root: p.root, actor: p, label: name }));
  placeRow(row, 0, 1.7);
}
// set=harbour: a mini Barnacle Bay diorama (quay, basin, rock, beach) exercising every harbour character
if (set === 'harbour') {
  const Q = 1.0; // quay top height
  const put = (ch, x, y, z, ry = 0, label) => { ch.root.position.set(x, y, z); ch.root.rotation.y = ry; stage.add(ch.root, 0, 0, 0, label); actors.push(ch); items.push({ object: ch.root, x, z }); return ch; };
  // set: water, quay, bollards, sand, rock
  pool(0, -4, 14, 5.2);
  add(meshOf([part(rbox(28, Q, 3.4, 0.12), [P.stoneDark, P.stone], { y: Q / 2 }), part(rbox(28.2, 0.14, 0.5, 0.06), P.stone, { y: Q, z: 1.5 })], materials.toy), 0, 0, -10.2);
  const bollards = [3.5, 5.5, 7.5, 9.5].map((x) => new THREE.Vector3(x, Q + 0.46, -8.75));
  for (const b of bollards) add(meshOf([part(cyl(0.16, 0.2, 0.42, 10), P.metalDark, { y: 0.21 }), part(cyl(0.24, 0.24, 0.06, 10), P.metalDark, { y: 0.43 })], materials.toy), b.x, Q, b.z);
  add(new THREE.Mesh(new THREE.PlaneGeometry(30, 8.5).rotateX(-Math.PI / 2), materials.solid(P.sand, { roughness: 0.95 })), 0, 0.02, 4.9);
  add(meshOf([part(jitter(ico(1, 1), 0.12), [P.stoneDark, P.stone], { sx: 2.0, sy: 0.75, sz: 1.3 })], materials.facet), 8.6, 0, -2.6);
  const fishBox = add(meshOf([part(rbox(0.9, 0.45, 0.6, 0.05), P.cobalt, { y: 0.225 }), part(rbox(0.8, 0.08, 0.5, 0.03), '#9fc2de', { y: 0.45 })], materials.toy), 0.2, Q, -9.6);
  // quay folk
  put(Person.preset('docker', { seed: 41, action: 'scratch' }), -10, Q, -9.6, 0.3, 'docker');
  put(Person.preset('docker', { seed: 42, action: 'point' }), -8.6, Q, -9.8, -0.4, 'docker');
  put(Person.preset('captain', { seed: 43, action: 'checkWatch' }), -5.5, Q, -9.5, 0.2, 'captain');
  const fred = put(Person.preset('fishmonger', { seed: 44, action: 'shakeFist' }), -1.4, Q, -9.5, 0.9, 'fishmonger (Fred)');
  const pel = put(new Pelican({ seed: 3, action: 'gulp' }), 1.4, Q, -9.4, -1.1, 'pelican');
  const gulls = new GullFlock({ seed: 8, count: 9, area: { x: 7, z: -9.6, w: 6, d: 1.4 }, groundY: Q, perches: bollards, water: { y: WATER_Y, area: { x: 1, z: -4, w: 12, d: 5 } }, circle: { x: 2, z: -4 } });
  stage.scene.add(gulls.root); actors.push(gulls);
  // water
  put(Person.preset('swimmer', { seed: 45 }), -7.5, WATER_Y, -4.2, 0.2, 'swimmer');
  const sw2 = put(Person.random(new Rng(46), { theme: 'beach', top: { type: 'swimsuit', color: P.teal, color2: '#fff8ee' }, bottom: { type: 'trunks', color: P.teal }, hat: { type: 'swimcap', color: P.sunflower, color2: P.tomato }, glasses: 'goggles' }), -4, WATER_Y, -5, 0, 'swim lap');
  new Walker(sw2, [[-5, -5.5], [-1.5, -5.5], [-1.5, -3.2], [-5, -3.2]], { loop: true, speed: 0.7, action: 'swim', groundY: () => WATER_Y });
  rowboat(3.2, -4.6, 0.62);
  const rower = put(Person.random(new Rng(47), { theme: 'harbour', action: 'row', actionOptions: { lost: true, bias: 0.4 } }), 3.2, 0.12, -4.6, Math.PI, 'lost rower');
  dinghy(-9.8, -1.8);
  put(Person.preset('sailorKid', { seed: 48, action: 'paddle' }), -9.8, 0.12, -1.8, 0.6, 'Kit');
  // seals on the rock (catch) + one sliding in
  const sA = put(new Seal({ seed: 1 }), 7.9, 0.66, -2.5, Math.PI / 2, 'seals');
  const sB = put(new Seal({ seed: 2 }), 9.4, 0.66, -2.7, -Math.PI / 2);
  const game = new SealCatch(sA, sB); stage.scene.add(game.ball); actors.push({ update: (dt) => game.update(dt) });
  const sC = put(new Seal({ seed: 5 }), 9.8, 0.6, -1.6, 0.4, 'seal');
  const slideAt = num('slide', 0.5); let slid = false;
  actors.push({ update: (dt, t) => { if (!slid && t >= slideAt) { slid = true; sC.slideInto(new THREE.Vector3(10.4, WATER_Y, -1.6)); } } });
  // beach
  towel(-8.5, 3.2); put(Person.preset('sunbather', { seed: 49 }), -8.5, 0, 3.2, 0.1, 'sunbather');
  deckchair(-6, 3.4); put(Person.random(new Rng(50), { theme: 'beach', action: 'lie', actionOptions: { pose: 'deckchair' } }), -6, 0, 3.4, 0, 'deckchair');
  sandcastle(-2.6, 3.8); put(Person.random(new Rng(51), { age: 'kid', theme: 'beach', action: 'dig' }), -2.6, 0, 3.8, 0.4, 'digger');
  put(Person.random(new Rng(52), { age: 'kid', theme: 'beach', action: 'dig' }), -1.7, 0, 4.9, -2.4);
  const tourist = put(Person.random(new Rng(53), { theme: 'beach', accessory: 'chips', top: { type: 'hawaiian' } }), 1.8, 0, 3.4, 0, 'chips');
  const stealAt = num('steal', 0.6); let stolen = false;
  actors.push({ update: (dt, t) => { if (!stolen && t >= stealAt) { stolen = true; gulls.stealChip(tourist); } } });
  lifeguardChair(5.4, 2.6, 1.4); put(Person.preset('lifeguard', { seed: 54, action: 'lookout', actionOptions: { height: 1.4 } }), 5.4, 0, 2.5, Math.PI, 'lifeguard');
  put(Person.preset('fisherman', { seed: 55, action: 'pull', actionOptions: { height: 0.6 } }), -11.5, 0, 1.4, Math.PI, 'Old Salty');
  { // his net rope runs down into the water
    const a = new THREE.Vector3(-11.5, 0.62, 0.85), b = new THREE.Vector3(-11.2, WATER_Y, -1.6);
    const d = b.clone().sub(a);
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, d.length(), 6), materials.solid('#e3c28a'));
    rope.position.copy(a).add(b).multiplyScalar(0.5); rope.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    stage.scene.add(rope);
    add(meshOf([part(sphere(0.14, 10, 8), (x, y, z, c) => c.set(y > 0 ? P.tomato : '#fff8ee'), {})], materials.toy), -11.2, WATER_Y + 0.05, -1.7);
  }
  const crab = put(new Crab({ seed: 1 }), 9, 0.02, 5, 0, 'crabs');
  new Walker(crab, [[8, 5.5], [11.5, 5.5]], { pingPong: true, speed: 0.5, action: 'scuttle' });
  put(new Crab({ seed: 2, action: 'snap' }), 10.6, 0.02, 3.8, -0.6);
  put(new Crab({ seed: 3, action: 'wave' }), 7.6, 0.02, 3.6, 0.5);
  window.__harbour = { fred, pel, gulls, tourist, rower, game, fishBox };
  stage.extent = 26;
}
if (set === 'crowd') {
  const crowd = new Crowd({ seed: num('seed', 3), area: { x: 0, z: 0, w: 22, d: 14 }, count: num('n', 36), groups: 5,
    paths: [[[-11, 6], [11, 6], [11, 8], [-11, 8]], [[-10, -7], [10, -5]]] });
  stage.scene.add(crowd.root);
  actors.push(crowd);
  const flock = new PigeonFlock({ seed: 5, count: 9, area: { x: 3, z: 1, w: 5, d: 4 } });
  stage.scene.add(flock.root);
  actors.push(flock);
  window.__crowd = crowd; window.__flock = flock;
  stage.extent = 24;
}

// only=<i>: isolate one item
if (params.has('only')) {
  const k = num('only', 0);
  items.forEach((it, i) => { it.object.visible = i === k; });
  const it = items[k];
  stage.extent = 2.2;
  stage.frameTarget = new THREE.Vector3(it.x, 0.9, it.z);
}

// ---- camera
const cam = params.get('cam') || 'front';
const xs = items.map((i) => i.x), zs = items.map((i) => i.z);
const cx = params.has('only') ? stage.frameTarget.x : (Math.min(...xs) + Math.max(...xs)) / 2;
const cz = params.has('only') ? stage.frameTarget.z : (Math.min(...zs) + Math.max(...zs)) / 2;
const width = params.has('only') ? 2.4 : (Math.max(...xs) - Math.min(...xs)) + 2;
if (set === 'crowd') stage.frame(new THREE.Vector3(0, 0, 0), 24);
else if (set === 'harbour' && cam !== 'scope') {
  const c = stage.camera;
  c.fov = num('fov', 42);
  c.position.set(num('cx', 0), num('h', 13), num('d', 19));
  c.updateProjectionMatrix();
  const tgt = new THREE.Vector3(0, 0, num('tz', -2.5));
  stage.controls.target.copy(tgt); c.lookAt(tgt); stage.controls.update();
} else if (set === 'harbour') stage.frame(new THREE.Vector3(0, 0.5, -2.5), 26);
else if (cam === 'front') {
  const c = stage.camera;
  c.fov = num('fov', 30);
  const d = num('d', (width / 2) / Math.tan(THREE.MathUtils.degToRad(c.fov / 2) * c.aspect) * 1.02 + 1.5);
  const h = num('h', 1.35 + d * 0.12);
  const yaw = THREE.MathUtils.degToRad(num('yaw', 0));
  c.position.set(cx + Math.sin(yaw) * d, h, cz + Math.max(...zs.map((z) => z - cz)) + Math.cos(yaw) * d);
  c.updateProjectionMatrix();
  const tgt = new THREE.Vector3(cx, num('ty', 0.85), cz);
  stage.controls.target.copy(tgt);
  c.lookAt(tgt);
  stage.controls.update();
} else if (all && cam === 'close') {
  stage.frame(new THREE.Vector3(cx, 0.4, cz + 0.2), 8.8);
} else stage.frame(new THREE.Vector3(cx, 0.8, cz), params.has('only') ? 2.5 : Math.max(8, width * 0.5));

if (params.get('look') === '1') for (const a of actors) a.lookAt?.(stage.camera.position);

// ---- clock (t=<sec> freezes the animation deterministically)
const reactAt = params.has('react') ? num('react', 0) : null;
const celebAt = params.has('celebrate') ? num('celebrate', 0) : null;
let fired = false, fired2 = false;
function step(dt, t) {
  if (reactAt != null && !fired && t >= reactAt) { fired = true; for (const a of actors) a.react?.(params.get('noorigin') ? {} : { origin: stage.camera.position.clone() }); }
  if (celebAt != null && !fired2 && t >= celebAt) { fired2 = true; for (const a of actors) a.celebrate?.(); }
  for (const a of actors) a.update(dt, t);
}
if (T != null) {
  let t = 0;
  const dt = 1 / 30;
  step(0, 0);
  stage.renderer.render(0); // one warm-up frame so characters have seen the camera (react fallback)
  while (t < T - 1e-6) { const h = Math.min(dt, T - t); t += h; step(h, t); }
} else stage.onUpdate(step);

// ---- stats for review tooling
const people = actors.filter((a) => a.kind === 'person');
window.__stats = {
  people: people.length,
  tris: people.map((p) => p.tris),
  maxTris: Math.max(0, ...people.map((p) => p.tris)),
  avgTris: people.length ? Math.round(people.reduce((s, p) => s + p.tris, 0) / people.length) : 0,
  animals: actors.filter((a) => a.kind === 'animal').map((a) => ({ name: a.species, tris: a.tris })),
};
// draw calls / triangles of the scene pass (with and without characters) for budgeting
{
  const r = stage.renderer.renderer;
  const measure = () => { r.info.autoReset = false; r.info.reset(); r.render(stage.scene, stage.camera); const o = { calls: r.info.render.calls, tris: r.info.render.triangles }; r.info.autoReset = true; return o; };
  const all = measure();
  const withRoot = actors.filter((a) => a.root);
  const vis = withRoot.map((a) => { const v = a.root.visible; a.root.visible = false; return v; });
  const hidden = [];
  if (set === 'harbour') stage.scene.traverse((o) => { if (o.isMesh && o.visible && !o.isSkinnedMesh && !withRoot.some((a) => a.root === o || a.root.getObjectById(o.id))) { o.visible = false; hidden.push(o); } });
  const base = measure();
  withRoot.forEach((a, i) => { a.root.visible = vis[i]; });
  for (const o of hidden) o.visible = true;
  window.__stats.calls = all.calls - base.calls;
  window.__stats.frameTris = all.tris - base.tris;
}
</script>
</body>
