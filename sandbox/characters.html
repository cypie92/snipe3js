<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Characters — Jack of All Blasts</title>
</head>
<body>
<script type="module">
// Character line-up studio (real renderer/post/lighting via stage.js).
// URL params (plus stage.js ones: cam, dist, zoom, yaw, preset, quality, labels, focus):
//   set=all|presets|random|animals|crowd   action=<name> (everyone)   t=<sec> freeze clock at t
//   react=<sec> trigger react() at that time   celebrate=<sec>   look=1 (everyone looks at camera)
//   n=<count> random villagers   seed=<n>   only=<index> show one item   bench=1 add benches for sit/sleep
import * as THREE from 'three';
import { createStage } from './stage.js';
import { Person, Crowd, Walker, ANIMALS, PigeonFlock } from '../src/world/characters/index.js';
import { Rng } from '../src/core/rng.js';
import { part, merge, rbox, meshOf } from '../src/world/geo.js';
import { materials } from '../src/gfx/materials.js';
import { P } from '../src/gfx/palette.js';

window.__chars = { THREE, Person, Crowd, Walker, ANIMALS, PigeonFlock, Rng };
const params = new URLSearchParams(location.search);
const num = (k, d) => (params.has(k) ? Number(params.get(k)) : d);
const set = params.get('set') || 'all';
const action = params.get('action');
const T = params.has('t') ? num('t', 0) : null;
const stage = await createStage({ cam: 'front', yaw: 0 });
const rng = new Rng(num('seed', 7));
const actors = [];   // everything with update(dt, t)
const items = [];    // { object, label, x, z }

function bench(x, z, h = 0.45) {
  const m = meshOf([
    part(rbox(1.1, 0.08, 0.42, 0.03), P.wood, { y: h - 0.04 }),
    part(rbox(0.08, h - 0.08, 0.36, 0.02), P.woodDark, { x: -0.45, y: (h - 0.08) / 2 }),
    part(rbox(0.08, h - 0.08, 0.36, 0.02), P.woodDark, { x: 0.45, y: (h - 0.08) / 2 }),
  ], materials.toy);
  m.position.set(x, 0, z - 0.02);
  stage.scene.add(m);
}

// range=a-b keeps only items a..b of each set; cols=<n> wraps rows into a grid (rows go back in -z)
const [ra, rb] = (params.get('range') || '0-999').split('-').map(Number);
function placeRow(list, z, spacing, label = true, cols = num('cols', 0), rowGap = 2.3) {
  list = list.slice(ra, rb + 1);
  const per = cols || list.length;
  list.forEach((it, idx) => {
    const n = Math.min(per, list.length - Math.floor(idx / per) * per);
    const i = idx % per;
    const x = (i - (n - 1) / 2) * spacing + (Math.floor(idx / per) % 2) * spacing * 0.5;
    const zz = z - Math.floor(idx / per) * rowGap;
    const obj = it.root;
    stage.add(obj, x, zz, 0, label ? it.label : undefined);
    items.push({ object: obj, x, z: zz });
    actors.push(it.actor);
    if (it.actor.kind === 'person' && (it.actor.action === 'sit' || it.actor.action === 'sleep') && !it.actor.blender?.cur.opts.stand) bench(x, zz);
    if (it.actor.action === 'fish') {
      const w = new THREE.Mesh(new THREE.CircleGeometry(0.9, 24).rotateX(-Math.PI / 2), materials.solid(P.water, { roughness: 0.2 }));
      w.position.set(x + 0.35, 0.01, zz + 2.4); stage.scene.add(w);
    }
  });
}

const apply = (p) => { if (action) p.setAction(action, {}, 0); return p; };
const all = set === 'all';

// "group photo" for set=all: animals in front, presets in two rows, random villagers behind
if ((all || set === 'animals') && ANIMALS) {
  const order = all ? ['Cow', 'Sheep', 'Dog', 'Cat', 'Pigeon', 'Chicken', 'Duck', 'Gull', 'Pelican'] : Object.keys(ANIMALS);
  const row = order.map((name, i) => [name, ANIMALS[name]]).map(([name, Cls], i) => {
    const a = new Cls({ seed: 3 + i });
    if (action && a.hasAction?.(action)) a.setAction(action, {}, 0);
    if (all && name === 'Duck') a.setAction('idle', {}, 0);
    return { root: a.root, actor: a, label: name };
  });
  placeRow(row, all ? 2.5 : 0, all ? 1.3 : 1.7);
}
if (all || set === 'presets') {
  const row = Person.presets.map((name, i) => {
    const p = apply(Person.preset(name, { seed: 101 + i * 37 }));
    if (all && !action && p.action === 'fish') p.setAction('idle', {}, 0);
    return { root: p.root, actor: p, label: name };
  });
  if (all) placeRow(row, 0.4, 1.45, true, 8, 1.7);
  else placeRow(row, 0, 1.45);
}
if (all || set === 'random') {
  const n = num('n', set === 'random' ? 24 : 16);
  const per = Math.ceil(n / 2);
  for (let r = 0; r < 2; r++) {
    const row = [];
    for (let i = 0; i < per && r * per + i < n; i++) {
      const p = apply(Person.random(rng));
      row.push({ root: p.root, actor: p, label: `#${r * per + i}` });
    }
    placeRow(row, set === 'random' ? -r * 2.6 : -3.1 - r * 1.7, set === 'random' ? 1.35 : 1.3, !all);
  }
}
if (set === 'crowd') {
  const crowd = new Crowd({ seed: num('seed', 3), area: { x: 0, z: 0, w: 22, d: 14 }, count: num('n', 36), groups: 5,
    paths: [[[-11, 6], [11, 6], [11, 8], [-11, 8]], [[-10, -7], [10, -5]]] });
  stage.scene.add(crowd.root);
  actors.push(crowd);
  const flock = new PigeonFlock({ seed: 5, count: 9, area: { x: 3, z: 1, w: 5, d: 4 } });
  stage.scene.add(flock.root);
  actors.push(flock);
  window.__crowd = crowd; window.__flock = flock;
  stage.extent = 24;
}

// only=<i>: isolate one item
if (params.has('only')) {
  const k = num('only', 0);
  items.forEach((it, i) => { it.object.visible = i === k; });
  const it = items[k];
  stage.extent = 2.2;
  stage.frameTarget = new THREE.Vector3(it.x, 0.9, it.z);
}

// ---- camera
const cam = params.get('cam') || 'front';
const xs = items.map((i) => i.x), zs = items.map((i) => i.z);
const cx = params.has('only') ? stage.frameTarget.x : (Math.min(...xs) + Math.max(...xs)) / 2;
const cz = params.has('only') ? stage.frameTarget.z : (Math.min(...zs) + Math.max(...zs)) / 2;
const width = params.has('only') ? 2.4 : (Math.max(...xs) - Math.min(...xs)) + 2;
if (set === 'crowd') stage.frame(new THREE.Vector3(0, 0, 0), 24);
else if (cam === 'front') {
  const c = stage.camera;
  c.fov = num('fov', 30);
  const d = num('d', (width / 2) / Math.tan(THREE.MathUtils.degToRad(c.fov / 2) * c.aspect) * 1.02 + 1.5);
  const h = num('h', 1.35 + d * 0.12);
  const yaw = THREE.MathUtils.degToRad(num('yaw', 0));
  c.position.set(cx + Math.sin(yaw) * d, h, cz + Math.max(...zs.map((z) => z - cz)) + Math.cos(yaw) * d);
  c.updateProjectionMatrix();
  const tgt = new THREE.Vector3(cx, num('ty', 0.85), cz);
  stage.controls.target.copy(tgt);
  c.lookAt(tgt);
  stage.controls.update();
} else if (all && cam === 'close') {
  stage.frame(new THREE.Vector3(cx, 0.4, cz + 0.2), 8.8);
} else stage.frame(new THREE.Vector3(cx, 0.8, cz), params.has('only') ? 2.5 : Math.max(8, width * 0.5));

if (params.get('look') === '1') for (const a of actors) a.lookAt?.(stage.camera.position);

// ---- clock (t=<sec> freezes the animation deterministically)
const reactAt = params.has('react') ? num('react', 0) : null;
const celebAt = params.has('celebrate') ? num('celebrate', 0) : null;
let fired = false, fired2 = false;
function step(dt, t) {
  if (reactAt != null && !fired && t >= reactAt) { fired = true; for (const a of actors) a.react?.({ origin: stage.camera.position }); }
  if (celebAt != null && !fired2 && t >= celebAt) { fired2 = true; for (const a of actors) a.celebrate?.(); }
  for (const a of actors) a.update(dt, t);
}
if (T != null) {
  let t = 0;
  const dt = 1 / 30;
  step(0, 0);
  while (t < T - 1e-6) { const h = Math.min(dt, T - t); t += h; step(h, t); }
} else stage.onUpdate(step);

// ---- stats for review tooling
const people = actors.filter((a) => a.kind === 'person');
window.__stats = {
  people: people.length,
  tris: people.map((p) => p.tris),
  maxTris: Math.max(0, ...people.map((p) => p.tris)),
  avgTris: people.length ? Math.round(people.reduce((s, p) => s + p.tris, 0) / people.length) : 0,
  animals: actors.filter((a) => a.kind === 'animal').map((a) => ({ name: a.species, tris: a.tris })),
};
// draw calls / triangles of the scene pass (with and without characters) for budgeting
{
  const r = stage.renderer.renderer;
  const measure = () => { r.info.autoReset = false; r.info.reset(); r.render(stage.scene, stage.camera); const o = { calls: r.info.render.calls, tris: r.info.render.triangles }; r.info.autoReset = true; return o; };
  const all = measure();
  const vis = actors.map((a) => { const v = a.root.visible; a.root.visible = false; return v; });
  const base = measure();
  actors.forEach((a, i) => { a.root.visible = vis[i]; });
  window.__stats.calls = all.calls - base.calls;
  window.__stats.frameTris = all.tris - base.tris;
}
</script>
</body>
</html>
